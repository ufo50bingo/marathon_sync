[package]
name = "marathon_sync"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "json", "cookies", "rustls", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.27", features = ["native-tls"] }
scraper = "0.27.0"
rpassword = "7.5.4"
url = "2.5.8"
tokio-util = { version = "0.7", features = ["rt"] }
num-format = "0.4.4"
